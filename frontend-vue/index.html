<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Pizzería</title>

    <!-- Marcellus (todos los títulos del sitio público: NavBar, Hero, Nosotros, Carta,
         Menú, Footer), Cormorant Garamond (texto en cursiva de Nosotros y la bajada del
         Hero) y Figtree (texto de interfaz: enlaces, botones, descripciones, precios):
         una sola pareja de fuentes para toda la página pública, para que se sienta como
         un solo sistema y no como secciones sueltas. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tipografías y íconos SOLO del panel de administración (/admin): Merriweather para
         los títulos y Plus Jakarta Sans para el texto, igual que el diseño de referencia en
         docs/diseno-admin-stitch.html. Conviven con las fuentes del sitio público de arriba
         sin pisarlas: cada grupo de componentes usa la suya a través de tokens.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
